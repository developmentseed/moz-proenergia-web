[build]
  # After `next build`, physically move the exported `out/` into `out/app/`
  # so that the URL path (`/app/...`) matches the filesystem. This avoids
  # a `/app/* -> /:splat` rewrite, which mangles URL-encoded characters like
  # `%5Bslug%5D` inside dynamic-route chunks and breaks pages such as
  # `/app/model/<slug>/`.
  command = "pnpm build && rm -rf out-staging && mv out out-staging && mkdir out && mv out-staging out/app"
  publish = "out"

# Visitors landing on / get sent to /app/.
[[redirects]]
  from = "/"
  to = "/app/"
  status = 301
  force = true
